name: Application CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete application
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify UI and API proxy
        run: |
          curl --fail --silent http://127.0.0.1:5174/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8788/health/ready
          curl --fail --silent http://127.0.0.1:5174/api/v1/warehouse/status
          curl --fail --silent -X POST http://127.0.0.1:5174/api/v1/workspace/bootstrap
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend/app backend/tests
      - name: Backend unit tests
        run: python -m pytest -c backend/pytest.ini backend/tests

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Start isolated MongoDB replica set
        run: docker compose -f backend/compose.dev.yml up -d --wait metadata-mongo
      - name: MongoDB integration tests
        env:
          METADATA_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=metadata-rs
        run: python -m pytest -c backend/pytest.ini backend/tests/integration/test_mongo.py -m integration -q
      - name: ClickHouse integration tests
        run: python backend/scripts/test_csv_integration.py
      - name: Stop CI database
        if: always()
        run: docker compose -f backend/compose.dev.yml down -v
