name: semantic

services:
  metadata-mongo:
    extends:
      file: ./backend/compose.dev.yml
      service: metadata-mongo
  sources-clickhouse:
    extends:
      file: ./backend/compose.dev.yml
      service: sources-clickhouse
  api:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      METADATA_ENVIRONMENT: ${METADATA_ENVIRONMENT:-development}
      METADATA_API_KEY: ${METADATA_API_KEY:-}
      METADATA_MONGO_URI: mongodb://metadata-mongo:27018/?replicaSet=metadata-rs&directConnection=true
      METADATA_MONGO_DATABASE: ${METADATA_MONGO_DATABASE:-semantic_metadata_v1}
      METADATA_CLICKHOUSE_HOST: sources-clickhouse
      METADATA_CLICKHOUSE_PORT: 8123
      METADATA_CLICKHOUSE_USERNAME: ${METADATA_CLICKHOUSE_USERNAME:-default}
      METADATA_CLICKHOUSE_PASSWORD: ${METADATA_CLICKHOUSE_PASSWORD:-semantic}
      METADATA_CLICKHOUSE_DATABASE: ${METADATA_CLICKHOUSE_DATABASE:-semantic}
      METADATA_CLICKHOUSE_SECURE: "false"
      METADATA_PLANNING_MAX_BYTES: ${METADATA_PLANNING_MAX_BYTES:-2147483648}
    ports:
      - "127.0.0.1:${METADATA_API_PORT:-8788}:8788"
    depends_on:
      metadata-mongo:
        condition: service_healthy
      sources-clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    stop_grace_period: 45s
  web:
    build: ./application
    restart: unless-stopped
    environment:
      METADATA_API_KEY: ${METADATA_API_KEY:-}
      NGINX_ENVSUBST_FILTER: ^METADATA_API_KEY$$
    ports:
      - "127.0.0.1:${METADATA_WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

# Retain existing storage identities independently of source folder/project names.
volumes:
  metadata-mongo:
    name: ${METADATA_MONGO_VOLUME:-backend_v1_metadata-mongo}
  sources-clickhouse:
    name: ${METADATA_CLICKHOUSE_VOLUME:-backend_v1_sources-clickhouse}
